server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Repassa as chamadas de API para o container do backend na rede interna do compose.
    location /api/ {
        # Precisa ficar igual ao limite do multer no backend (backend/src/routes/conversions.ts); sem isso o
        # Nginx corta uploads acima de 1MB (padrao dele).
        client_max_body_size 1024M;
        # Conversoes de video/documentos grandes podem demorar mais que o timeout padrao de 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
